services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  backend:
    user: root
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./api:/api:Z

  db:
    ports:
      - "5432:5432"